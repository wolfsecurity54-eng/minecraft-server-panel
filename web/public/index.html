<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Minecraft Server Control Panel</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231e3a1e'/><g fill='%2370bf4a'><rect x='20' y='30' width='60' height='50' rx='2'/></g><g fill='%235a3a1e'><rect x='30' y='20' width='40' height='15' rx='1'/></g><g fill='%23fff'><rect x='28' y='40' width='6' height='6'/><rect x='42' y='40' width='6' height='6'/><rect x='56' y='40' width='6' height='6'/><rect x='35' y='55' width='6' height='6'/><rect x='49' y='55' width='6' height='6'/></g></svg>">
</head>
<body>
<div id="app">
  <div id="setup-wizard" class="wizard-overlay" style="display:none">
    <div class="wizard-container">
      <div class="wizard-header">
        <h1>🚀 Setup Wizard</h1>
        <p>Minecraft Server Control Panel</p>
        <div class="wizard-progress">
          <div class="wizard-progress-bar" id="wizard-progress-bar"></div>
          <div class="wizard-step-info" id="wizard-step-info"></div>
        </div>
      </div>
      <div class="wizard-body" id="wizard-body"></div>
      <div class="wizard-footer">
        <button class="btn btn-secondary" id="wizard-prev">← Zurück</button>
        <div class="wizard-footer-spacer"></div>
        <button class="btn btn-primary" id="wizard-next">Weiter →</button>
      </div>
    </div>
  </div>

  <div id="login-screen" class="login-screen" style="display:none">
    <div class="login-container">
      <div class="login-logo">
        <svg viewBox="0 0 100 100" width="80" height="80">
          <rect width="100" height="100" fill="#1e3a1e" rx="8"/>
          <g fill="#70bf4a">
            <rect x="20" y="30" width="60" height="50" rx="2"/>
          </g>
          <g fill="#5a3a1e">
            <rect x="30" y="20" width="40" height="15" rx="1"/>
          </g>
          <g fill="#fff">
            <rect x="28" y="40" width="6" height="6"/>
            <rect x="42" y="40" width="6" height="6"/>
            <rect x="56" y="40" width="6" height="6"/>
            <rect x="35" y="55" width="6" height="6"/>
            <rect x="49" y="55" width="6" height="6"/>
          </g>
        </svg>
        <h1>Minecraft Panel</h1>
        <p>Server Control Center</p>
      </div>
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label>Benutzername</label>
          <input type="text" id="login-username" required autocomplete="username" value="admin">
        </div>
        <div class="form-group">
          <label>Passwort</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <div id="login-error" class="error-message"></div>
        <button type="submit" class="btn btn-primary btn-block">Anmelden</button>
      </form>
    </div>
  </div>

  <div id="main-app" class="main-app" style="display:none">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg viewBox="0 0 100 100" width="32" height="32">
            <rect width="100" height="100" fill="#5fb337" rx="6"/>
            <g fill="#1e3a1e"><rect x="30" y="20" width="40" height="20" rx="1"/><rect x="20" y="40" width="60" height="50" rx="2"/></g>
            <g fill="#fff"><rect x="30" y="50" width="8" height="8"/><rect x="46" y="50" width="8" height="8"/><rect x="62" y="50" width="8" height="8"/><rect x="38" y="70" width="8" height="8"/><rect x="54" y="70" width="8" height="8"/></g>
          </svg>
          <span>Minecraft Panel</span>
        </div>
        <button class="sidebar-toggle" id="sidebar-toggle-mobile">×</button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="user-info" id="user-info">
          <div class="user-avatar" id="user-avatar">A</div>
          <div class="user-details">
            <div class="user-name" id="user-name">Admin</div>
            <div class="user-role" id="user-role">Owner</div>
          </div>
        </div>
        <button class="btn-icon" id="logout-btn" title="Abmelden">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
          </svg>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebar-toggle">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </button>
        <div class="topbar-title" id="page-title">Dashboard</div>
        <div class="topbar-status">
          <div class="status-pill" id="status-pill">
            <span class="status-dot"></span>
            <span id="status-text">Offline</span>
          </div>
          <div class="uptime-display" id="uptime-display"></div>
        </div>
      </header>

      <div class="page-content" id="page-content"></div>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="btn-icon modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
